# Pipeline CI/CD do Café Artesanal
#  - backend: compila e roda os testes automatizados (.NET 8)
#  - banco:   executa o script SQL num MariaDB real, chama as procedures e roda os testes de integração
#  - mobile:  análise estática, testes e build do APK do app Flutter
#  - imagem:  gera a imagem Docker; na branch main publica no GitHub Container Registry (CD)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CafeArtesanal.sln
      - run: dotnet build CafeArtesanal.sln -c Release --no-restore
      - run: dotnet test tests/CafeArtesanal.Tests -c Release --no-build --logger "trx;LogFileName=resultados.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: tests/**/TestResults/*.trx

  banco:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      # O cliente novo do MariaDB exige SSL por padrão; o banco descartável do CI não usa SSL.
      - name: Executa o script completo do banco
        run: mariadb --skip-ssl -h 127.0.0.1 -uroot -pci < database/bd_cafe_artesanal.sql
      - name: Verifica procedures, triggers e views
        run: |
          mariadb --skip-ssl -h 127.0.0.1 -uroot -pci bd_cafe_artesanal -e "
            CALL sp_dashboard_resumo(CURDATE() - INTERVAL 30 DAY, CURDATE());
            CALL sp_produtos_mais_vendidos(CURDATE() - INTERVAL 30 DAY, CURDATE(), 3);
            SELECT COUNT(*) AS triggers FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = 'bd_cafe_artesanal';
            SELECT * FROM vw_produtos_estoque_baixo;"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes de integração (API + banco real)
        run: dotnet test tests/CafeArtesanal.IntegrationTests -c Release
        env:
          TESTE_DB_CONEXAO: "Server=127.0.0.1;Port=3306;User=root;Password=ci;CharSet=utf8mb4;"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Versão fixa: a mesma usada no desenvolvimento, para uma versão nova do Flutter não quebrar o CI.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  imagem:
    needs: [backend, banco]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem em minúsculas (exigência do registry)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cafe-artesanal-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGEM }}:latest,${{ env.IMAGEM }}:${{ github.sha }}
