<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos | Café Artesanal</title>
  <meta name="theme-color" content="#4B2E2B">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/tema-inicial.js"></script>
  <script type="module" src="js/paginas/pedidos.js"></script>
</head>
<body>
  <main id="conteudo" tabindex="-1">
    <div class="container">
      <header class="cabecalho-pagina linha-entre">
        <div>
          <h1>Meus pedidos</h1>
          <p>Acompanhe cada etapa. A página se atualiza sozinha enquanto houver pedidos em andamento.</p>
        </div>
        <button type="button" class="botao" id="atualizar">Atualizar</button>
      </header>
      <div id="mensagem"></div>
      <div class="chips mb-0" role="group" aria-label="Filtrar pedidos" id="filtros">
        <button type="button" class="chip" data-filtro="abertos" aria-pressed="false">Em andamento</button>
        <button type="button" class="chip" data-filtro="" aria-pressed="true">Todos</button>
      </div>
      <div id="lista" class="pilha mt-2" aria-live="polite"></div>
      <p class="texto-centro mt-2"><button type="button" class="botao" id="mais" hidden>Carregar mais</button></p>
    </div>
  </main>
</body>
</html>
